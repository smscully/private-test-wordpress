apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-test-wordpress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smscully/private-test-wordpress.git
    targetRevision: main
    path: .
    directory:
      # Keep Argo CD from also applying this Application file
      exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
